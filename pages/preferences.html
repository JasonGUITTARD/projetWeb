<!DOCTYPE html>
	<html lang="fr" data-bs-theme="light">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Choisir les préférences du site. Cela peut être le theme en sombre ou clair comme l'afficahge des apprenants sur la page d'acceuil">
		<title>PromoENI - Préférences</title>
		<link rel="stylesheet" href="../css/style.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<link rel="preload" fetchpriority="high" as="image" href="../assets/Images/logo.webp" type="image/webp">
	</head>
	<body class="container-fluid">
		<canvas id="particles-bg" aria-hidden="true"></canvas>
		<header>
			<nav class="navbar navbar-expand-xl">
				<div class="container-fluid">
					<a class="navbar-brand col-sm-auto col-2"><img src="../assets/Images/logo.webp" alt="Logo de l'école ENI" class="img-fluid" width="128" height="128"></a>
					<h1 class="text-center col-7" nomPromo></h1>
					<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler" aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>	
					<div class="collapse navbar-collapse" id="navbarToggler">
						<ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2 flex-wrap">
							<li class="nav-item">
								<a href="../index.html" class="btn btn-cyan btn-lg" role="button">Acceuil</a>
							</li>
							<li class="nav-item">
								<a href="preferences.html" class="btn btn-gold btn-lg" role="button">Préférences</a>
							</li>
							<li class="nav-item">
								<a href="carte.html" class="btn btn-cyan btn-lg" role="button">Carte</a>
							</li>
							<li class="nav-item">
								<a href="informations.html" class="btn btn-cyan btn-lg" role="button">Informations</a>
							</li>
						</ul>
					</div>
				</div>
			</nav>
		</header>
		<main class="container-fluid mt-5">
			<div class="text-center pt-5">
				<div class="justify-content-center glass-panel">
					<h3 class="mb-5 text-gold">Préférences du site</h3>
					<form class="row" action="POST">
						<div class="row justify-content-sm-center text-sm-start text-center">
							<div class="col-sm-3 col">
								<label for="theme">Thème du site</label>
							</div>
							<div class="col-sm-1 mt-sm-0 mt-2justify-content-center">
								<select name="theme" id="theme" class="form-select form-select-sm resize-select-sm m-auto mt-sm-auto mt-2">
									<option value="dark" id="optDark">Sombre</option>
									<option value="light" id="optLight" selected>Clair</option>
								</select>
							</div>
						</div>
						<div class="row justify-content-center mt-4 text-sm-start text-center">
							<div class="col-sm-3 col">
								<p>Format d'affichage de la liste des apprenants</p>
							</div>
							<div class="col-sm-1">
								<div class="col-sm">
									<input type="radio" name="display" id="table" class="form-check-input" checked>
									<label for="table" class="form-check-label">Liste (Table)</label>
								</div>
								<div class="col-sm">
									<input type="radio" name="display" id="grid" class="form-check-input">
									<label for="grid" class="form-check-label">Cartes (Grid)</label>
								</div>

							</div>
						</div>
						<div class="d-sm-flex flex-sm-row justify-content-sm-center gap-4 mt-5 row-cols-sm-auto row-cols-2">
							<a href="index.html" class="btn btn-cyan" role="button">Retour à la page d'Acceuil</a>
							<button type="submit" class=" btn btn-gold mt-sm-0 mt-3" id="savePref">Enregistrer</button>
						</div>
					</form>
				</div>

			</div>
		</main>
		<div class="toast-container position-fixed bottom-0 end-0 p-3">
			<div id="notificationToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
				<div class="toast-body">
					Les paramètres ont été enregistré avec succès !
				</div>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		<script src="../js/scriptPref.js"></script>
		<script src="../js/background.js"></script>
	</body>
</html>
