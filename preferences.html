<!DOCTYPE html>
	<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>PromoENI - Préférences</title>
				<link rel="stylesheet" href="style.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	</head>
	<body>
		<header>
			<nav class="navbar navbar-expand-lg">
				<div class="container-fluid">
					<a href="navbar-brand"><img src="assets/Images/logo.png" alt="Logo de l'école ENI" class="img-fluid display-none-custom"></a>
					<h1 class="text-center col-7">Promo EDWM2511FT</h1>
					<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler" aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>	
					<div class="collapse navbar-collapse" id="navbarToggler">
						<ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
							<li class="nav-item">
								<a href="index.html" class="btn btn-dark btn-lg" role="button">Acceuil</a>
							</li>
							<li class="nav-item">
								<a href="preferences.html" class="btn btn-dark btn-lg" role="button">Préférences</a>
							</li>
							<li class="nav-item">
								<a href="#" class="btn btn-dark btn-lg" role="button">Carte</a>
							</li>
							<li class="nav-item">
								<a href="informations.html" class="btn btn-dark btn-lg" role="button">Informations</a>
							</li>
						</ul>
					</div>
				</div>
			</nav>
		</header>
		<main class="container-fluid mt-5">
			<form class="text-center pt-5">
				<h3 class="mb-5">Préférences du site</h3>
				<form class="row" action="POST">
					<div class="row justify-content-center text-start">
						<div class="col-3">
							<label for="theme">Thème du site</label>
						</div>
						<div class="col-1">
							<select name="theme" id="theme">
								<option value="dark" id="optDark">Sombre</option>
								<option value="light" id="optLight" selected>Clair</option>
							</select>
						</div>
					</div>
					<div class="row justify-content-center mt-4 text-start">
						<div class="col-3">
							<p>Format d'affichage de la liste des apprenants</p>
						</div>
						<div class="col-1 justify-content-start">
							<div class="col">
								<input type="radio" name="display" id="tableRadio" class="form-check-input" checked>
								<label for="table" class="form-check-label">Liste (Table)</label>
							</div>
							<div class="col">
								<input type="radio" name="display" id="gridRadio" class="form-check-input">
								<label for="grid" class="form-check-label">Cartes (Grid)</label>
							</div>

						</div>
					</div>
					<div class="d-flex justify-content-center gap-4 mt-5">
						<a href="index.html" class="btn btn-primary" role="button">Retour à la page d'Acceuil</a>
						<button type="submit" class=" btn btn-primary" id="savePref">Enregistrer</button>
					</div>
				</form>
			</form>
		</main>
		<script src="scriptPref.js"></script>
	</body>
</html>
