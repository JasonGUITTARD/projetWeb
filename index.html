<!DOCTYPE html>
	<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Page d'acceuil affichant la liste des apprenant de l'école ENI sur la promo EDWM2511FT.">
		<title>PromoENI</title>
		<link rel="stylesheet" href="style.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<link rel="preload" fetchpriority="high" as="image" href="assets/Images/logo.webp" type="image/webp">
		<link rel="preload" fetchpriority="high" as="image" href="assets/Images/Avatar/avatar.webp" type="image/webp">
		<link rel="preload" fetchpriority="high" as="image" href="assets/Images/Avatar/jasonGUITTARD.webp" type="image/webp">
	</head>
	<body class="container-fluid" data-bs-theme="light">
		<header>
			<nav class="navbar navbar-expand-lg">
				<div class="container-fluid">
					<a href="navbar-brand"><img src="assets/Images/logo.webp" alt="Logo de l'école ENI" class="img-fluid display-none-custom"></a>
					<h1 class="text-center col-7">Promo EDWM2511FT</h1>
					<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler" aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>	
					<div class="collapse navbar-collapse" id="navbarToggler">
						<ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
							<li class="nav-item">
								<a href="index.html" class="btn btn-dark btn-lg" role="button">Acceuil</a>
							</li>
							<li class="nav-item">
								<a href="preferences.html" class="btn btn-dark btn-lg" role="button">Préférences</a>
							</li>
							<li class="nav-item">
								<a href="#" class="btn btn-dark btn-lg" role="button">Carte</a>
							</li>
							<li class="nav-item">
								<a href="informations.html" class="btn btn-dark btn-lg" role="button">Informations</a>
							</li>
						</ul>
					</div>
				</div>
			</nav>
		</header>
		<main class="mt-4 row">
			<div class="text-end justify-content-end pe-5 mb-4">
				<label class="me-4">Type d'affichage</label>
				<input type="radio" name="display" id="table" class="form-check-input" checked>
				<label for="table" class="pe-2 form-check-label">Liste</label>
				<input type="radio" name="display" id="grid" class="form-check-input">
				<label for="grid" class="form-check-label">Cartes</label>
			</div>
			<div class="col-sm-7" id="tableDisplay">
				<h3>Liste des apprenants</h3>
				<div class="table-height">
					<table class="table table-striped table-responsive-sm border-top border-end border-start">
						<thead>
							<tr>
								<th scope="col">Nom</th>
								<th scope="col">Prénom</th>
								<th scope="col">Ville</th>
								<th scope="col">Liens</th>
							</tr>
						</thead>
						<tbody class="align-middle" id="apprenantsTable">
							<template id="templateListeApprenants">
								<tr>
									<td scope="row" lastname></td>
									<td name></td>
									<td city></td>
									<td><a href="#" class="btn btn-link" role="button">Détail</a></td>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
			</div>
			<div class="row row-cols-sm-6 gap-5" id="gridDisplay">
				<template id="templateGridApprenants">
					<div class="card col">
						<img src="assets/Images/Avatar/avatar.webp" alt="" class="card-img-top rounded-circle img-fluid">
						<div class="card-body">
							<h5 class="card-title"></h5>
							<p class="card-text"></p>
							<a href="" class="btn btn-primary">Détails</a>
						</div>
					</div>
				</template>
			</div>
		</main>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		<script src="scriptIndex.js"></script>
	</body>
</html>
