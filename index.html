<!DOCTYPE html>
	<html lang="fr" data-bs-theme="light">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Page d'acceuil affichant la liste des apprenant de l'école ENI sur la promo EDWM2511FT.">
		<title>PromoENI</title>
		<link rel="stylesheet" href="css/style.css">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<link rel="preload" fetchpriority="high" as="image" href="assets/Images/logo.webp" type="image/webp">
		<link rel="preload" fetchpriority="high" as="image" href="assets/Images/Avatar/avatar.webp" type="image/webp">
		<link rel="preload" fetchpriority="high" as="image" href="assets/Images/Avatar/jasonGUITTARD.webp" type="image/webp">
	</head>
	<body class="container-fluid">
		<canvas id="particles-bg" aria-hidden="true"></canvas>
		<header>
			<nav class="navbar navbar-expand-lg">
				<div class="container-fluid">
					<a class="navbar-brand col-sm-auto col-2"><img src="../assets/Images/logo.webp" alt="Logo de l'école ENI" class="img-fluid"></a>
					<h1 class="text-center col-7" nomPromo></h1>
					<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarToggler" aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>	
					<div class="collapse navbar-collapse" id="navbarToggler">
						<ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
							<li class="nav-item">
								<a href="index.html" class="btn btn-gold btn-lg" role="button">Acceuil</a>
							</li>
							<li class="nav-item">
								<a href="pages/preferences.html" class="btn btn-cyan btn-lg" role="button">Préférences</a>
							</li>
							<li class="nav-item">
								<a href="pages/carte.html" class="btn btn-cyan btn-lg" role="button">Carte</a>
							</li>
							<li class="nav-item">
								<a href="pages/informations.html" class="btn btn-cyan btn-lg" role="button">Informations</a>
							</li>
						</ul>
					</div>
				</div>
			</nav>
		</header>
		<main class="mt-2 row">
			<div class="pe-5 mb-4 glass-panel">
				<div class="col-11 text-end">
					<label class="me-4">Type d'affichage</label>
					<input type="radio" name="display" id="table" class="form-check-input" checked>
					<label for="table" class="pe-2 form-check-label">Liste</label>
					<input type="radio" name="display" id="grid" class="form-check-input">
					<label for="grid" class="form-check-label">Cartes</label>
				</div>
			</div>
			<div class="col-sm-7 glass-panel" id="tableDisplay">
				<h3 class="text-gold">Liste des apprenants</h3>
				<div class="table-height">
					<table class="table table-striped table-responsive-sm border-top border-end border-start">
						<thead>
							<tr>
								<th scope="col">Nom</th>
								<th scope="col">Prénom</th>
								<th scope="col">Ville</th>
								<th scope="col">Liens</th>
							</tr>
						</thead>
						<tbody class="align-middle" id="apprenantsTable">
							<template id="templateListeApprenants">
								<tr>
									<td scope="row" lastname></td>
									<td name></td>
									<td city></td>
									<td detail><a href="#" class="btn btn-link" role="button">Détails</a></td>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
			</div>
			<div class="glass-panel" id="gridDisplayDiv">
				<h3 class="text-gold text-center">Liste des apprenants</h3>
				<div class="row row-cols-lg-6 row-cols-sm-4 row-cols-2 gap-5 ms-0 justify-content-center" id="gridDisplay"></div>
				<template id="templateGridApprenants">
					<div class="card col-10">
						<img src="assets/Images/Avatar/avatar.webp" alt="" class="card-img-top rounded-circle img-fluid mt-3">
						<div class="card-body pb-3 text-center">
							<h5 class="card-title"></h5>
							<p class="card-text text-wrap"></p>
							<a class="btn btn-primary" detail>Détails</a>
						</div>
					</div>
				</template>
			</div>
		</main>
		<div id="detailModal" class="modal fade" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true"">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<img class="img-fluid rounded col-3 me-4" avatar>
						<div class="">
							<h3 lastname></h3>
							<h3 name></h3>
							<h3 city></h3>
						</div>
						<button type="button" class="btn-close align-self-start" data-bs-dismiss="modal" aria-label="close"></button>
					</div>
					<div class="modal-body">
						<div class="mb-2">Liste des anecdotes: </div>
						<div class="border border-2 border-black px-2" story></div>
					</div>
				</div>
			</div>
		</div>
		
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		<script src="js/scriptIndex.js"></script>
		<script src="js/background.js"></script>
	</body>
</html>
